<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="보행과 인지 부하에 따른 스마트폰 진동 알림 식별 실험">
  <link rel="manifest" href="manifest.webmanifest">
  <title>촉각 알림 이중과업 실험</title>
  <style>
    :root{color-scheme:dark;--bg:#101820;--panel:#182630;--muted:#a8bac5;--line:#314650;--accent:#66d9c2;--warn:#ffd166;--danger:#ff7777}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f7f9;font:16px/1.5 system-ui,"Malgun Gothic",sans-serif}main{max-width:780px;margin:auto;padding:18px}h1{font-size:1.45rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted);font-size:.92rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}input,select,button{font:inherit;color:inherit}input,select{background:#0f1a20;border:1px solid #55707b;border-radius:9px;padding:11px;width:100%}button{background:#24414a;border:1px solid #54717c;border-radius:10px;padding:11px 14px;cursor:pointer}button.primary{background:#087f70;border-color:#54c5b3;font-weight:700}button.danger{background:#632d34;border-color:#b86168}button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:.85rem}.status{padding:10px;border-radius:9px;background:#0d171c;color:var(--accent);min-height:44px}.big{font-size:2.8rem;font-variant-numeric:tabular-nums;text-align:center;padding:18px}.warning{color:var(--warn)}.dangerText{color:var(--danger)}.progress{height:9px;background:#30414a;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.checks label{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.checks input{width:auto;margin-top:5px}.hide{display:none!important}.small{font-size:.84rem}.right{margin-left:auto}footer{color:var(--muted);font-size:.82rem;margin:20px 0 10px}.ratings{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}.ratings input{padding:8px}
    body.running{background:#000}body.running main{max-width:none;min-height:100vh;padding:8px}body.running #appHeader,body.running #stageMeta{display:none}body.running #stage{min-height:calc(100vh - 16px);background:#000;color:#000}body.running #stage .operator-stop{position:fixed;left:-10000px}
  </style>
</head>
<body>
<main>
  <header id="appHeader"><h1>촉각 알림 이중과업 실험</h1><div class="muted">이동과 계산 부하에 따른 진동 패턴 식별</div></header>
  <div id="stageMeta" class="row muted"><span id="secureStatus" class="pill">기기 점검 전</span><span id="saveStatus" class="right">자료는 이 기기의 브라우저에 저장됩니다.</span></div>
  <section id="stage"></section>
  <footer>연구용 프로토타입 · 실험 전에 파일럿으로 기기 지연, 이어폰 음량, 보행 안전을 확인하세요. 이 페이지는 물리적 진동 시작 시각을 측정하지 않습니다.</footer>
</main>
<script>
(() => {
  'use strict';
  const SEQ={
    A:['S0','S1','W1','W0'], B:['S1','W0','S0','W1'],
    C:['W0','W1','S1','S0'], D:['W1','S0','W0','S1']
  };
  const CNAME={S0:'서기 · 계산 없음',S1:'서기 · 계산',W0:'걷기 · 계산 없음',W1:'걷기 · 계산'};
  const $=s=>document.querySelector(s), stage=$('#stage');
  let audio=null, noiseNode=null, noiseGain=null, wakeLock=null, recorder=null, micStream=null, recordedChunks=[],voiceBlob=null;
  let session=null, running=false, timers=[], activeTrial=null, captureKey=null, mapped={A:null,B:null};
  let currentCondition=null, currentBlock=0, audioBaseline=null;

  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function nowIso(){return new Date().toISOString();}
  function setStatus(s){$('#saveStatus').textContent=s;}
  function setSecure(){const ok=window.isSecureContext;$('#secureStatus').textContent=ok?'보안 컨텍스트':'일부 브라우저 기능 제한 가능';$('#secureStatus').className='pill '+(ok?'':'warning');}
  function save(){if(!session)return;try{localStorage.setItem('hf-vibration-session-'+session.id,JSON.stringify(session));setStatus('자동 저장됨 · '+new Date().toLocaleTimeString());}catch(e){setStatus('저장 실패: 자료를 내보내세요.');}}
  function addEvent(type,detail={}){if(!session)return;session.events.push({timestamp:nowIso(),perf_ms:Math.round(performance.now()),type,...detail});save();}
  function setRunningVisual(on){document.body.classList.toggle('running',on);}
  function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function randomInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function trialOrder(){const a=shuffle([...Array(4).fill('P1'),...Array(4).fill('P2')]);return a;}
  function getAudio(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('이 브라우저에서 Web Audio를 사용할 수 없습니다.');audio=new AC();}return audio;}
  function startNoise(level=.035){
    const ctx=getAudio(); if(noiseNode)return;
    const n=Math.max(1,Math.floor(ctx.sampleRate*2)),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.96900*b2+w*.1538520;b3=.86650*b3+w*.3104856;b4=.55000*b4+w*.5329522;b5=-.7616*b5-w*.0168980;const pink=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;d[i]=pink;}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=100;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3500;
    const g=ctx.createGain();g.gain.value=level;src.connect(hp).connect(lp).connect(g).connect(ctx.destination);src.start();
    noiseNode=src;noiseGain=g;
  }
  function stopNoise(){if(noiseNode){try{noiseNode.stop();}catch{}noiseNode=null;noiseGain=null;}}
  function toneAt(when){const ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.12,when+.004);g.gain.exponentialRampToValueAtTime(.0001,when+.055);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+.06);}
  async function activateAudio(){const ctx=getAudio();await ctx.resume();}
  async function requestWake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){wakeLock=null;}}
  async function keepAwake(){await requestWake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)requestWake();});}
  function vib(pattern){if(!('vibrate'in navigator))return false;try{return navigator.vibrate(pattern);}catch{return false;}}
  function patternSeq(p){return p==='P1'?[200,150,400,150,200]:[200,150,200,150,400];}
  function makeId(){return 'P'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,5).toUpperCase();}
  function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
  function csvEscape(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"';}
  function exportCsv(){if(!session)return;const rows=session.trials;const fields=['participant_id','condition','block','trial','pattern','pattern_button','beat_offset_ms','planned_onset_rel_ms','actual_call_rel_ms','response_key','correct','response_delay_ms','timeout','anticipatory','turn_or_overlap','device_error'];const lines=[fields.map(csvEscape).join(',')];for(const r of rows)lines.push(fields.map(k=>csvEscape(r[k])).join(','));download(`${session.id}_trials.csv`,new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));}
  function exportJson(){if(session)download(`${session.id}_session.json`,new Blob([JSON.stringify(session,null,2)],{type:'application/json'}));}
  function beginMic(){return new Promise(async(resolve,reject)=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('이 브라우저는 음성 녹음을 지원하지 않습니다.');micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recorder=new MediaRecorder(micStream);recordedChunks=[];recorder.ondataavailable=e=>{if(e.data?.size)recordedChunks.push(e.data);};recorder.onstop=()=>{voiceBlob=new Blob(recordedChunks,{type:recorder.mimeType||'audio/webm'});const button=$('#voiceDownload');if(button)button.disabled=false;micStream?.getTracks().forEach(t=>t.stop());micStream=null;};recorder.start(1000);resolve();}catch(e){reject(e);}});}
  function stopMic(){if(recorder&&recorder.state!=='inactive')recorder.stop();else if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
  function screen(title,content){stage.innerHTML=`<div class="card"><h2>${title}</h2>${content}</div>`;}

  function renderSetup(){setRunningVisual(false);setSecure();screen('세션 설정',`
    <p class="muted">실험 ID와 배정 순서를 입력하고, 이어폰·진동·리모컨을 먼저 점검하세요. 참가자 화면 녹화가 필요하면 별도 카메라를 사용합니다.</p>
    <div class="grid"><label class="field">참가자 익명 ID<input id="pid" placeholder="예: P01" maxlength="24"></label><label class="field">Williams 순서<select id="seq"><option value="A">A · S0-S1-W1-W0</option><option value="B">B · S1-W0-S0-W1</option><option value="C">C · W0-W1-S1-S0</option><option value="D">D · W1-S0-W0-S1</option></select></label></div>
    <label class="field">버튼 대응<select id="mapping"><option value="AB">버튼 A = P1, 버튼 B = P2</option><option value="BA">버튼 A = P2, 버튼 B = P1</option></select></label>
    <div class="card"><h2>기기 사전 점검</h2><label class="field">잡음 크기 (파일럿에서 최소 수준으로 조정)<input id="noiseLevel" type="number" min="0.005" max="0.2" step="0.005" value="0.025"></label><div class="row"><button id="vibTest">짧은 진동 확인</button><button id="noiseTest">박자음·분홍 잡음 확인</button><button id="stopTest">점검 소리·진동 중지</button></div><div class="grid"><button id="capA">리모컨 버튼 A 지정</button><button id="capB">리모컨 버튼 B 지정</button></div><p id="keyStatus" class="status">버튼 A: 미지정 · 버튼 B: 미지정</p><p id="preflight" class="muted">화면을 터치한 뒤 테스트 버튼을 눌러 브라우저의 소리·진동 권한을 활성화하세요.</p></div>
    <div class="checks"><label><input type="checkbox" id="consent"> 참가자에게 연구 절차·보행 중단 방법·자료 수집을 설명하고 동의를 받았습니다.</label><label><input type="checkbox" id="audioConsent"> 참가자가 음성 녹화에 별도로 동의했습니다. (동의하지 않으면 체크하지 않아도 됩니다.)</label></div>
    <div class="row"><button class="primary" id="startSession">세션 시작</button><button id="showSaved">이 기기의 저장 세션</button></div>
    <p class="small warning">보행 조건은 조용하고 안전한 실내에서만 진행하세요. 이어폰 음량은 안전 담당자가 주변 지시를 전달할 수 있는 수준으로 파일럿에서 확인합니다.</p>`);
    mapped={A:null,B:null};
    const updateKeys=()=>$('#keyStatus').textContent=`버튼 A: ${mapped.A||'미지정'} · 버튼 B: ${mapped.B||'미지정'}`;
    $('#vibTest').onclick=()=>{const ok=vib([200,150,200]);$('#preflight').textContent=ok?'진동 명령을 보냈습니다. 실제 진동을 확인하세요.':'진동 API를 사용할 수 없거나 명령이 거부되었습니다.';};
    $('#noiseTest').onclick=async()=>{try{const level=Number($('#noiseLevel').value);if(level<.005||level>.2)throw Error('잡음 크기는 0.005~0.2 범위로 입력하세요.');await activateAudio();stopNoise();startNoise(level);toneAt(audio.currentTime+.1);toneAt(audio.currentTime+1.1);$('#preflight').textContent='박자음과 분홍 잡음을 재생했습니다. 파일럿에서 식별 가능 여부와 주변 지시 청취를 확인하세요.';}catch(e){$('#preflight').textContent=e.message;}};
    $('#stopTest').onclick=()=>{vib(0);stopNoise();$('#preflight').textContent='점검 신호를 중지했습니다.';};
    $('#capA').onclick=()=>{captureKey='A';$('#preflight').textContent='이제 리모컨에서 버튼 A로 사용할 키를 한 번 누르세요.';};
    $('#capB').onclick=()=>{captureKey='B';$('#preflight').textContent='이제 리모컨에서 버튼 B로 사용할 키를 한 번 누르세요.';};
    $('#startSession').onclick=async()=>{const id=$('#pid').value.trim();if(!id){alert('익명 참가자 ID를 입력하세요.');return;}if(!$('#consent').checked){alert('동의 확인을 완료하세요.');return;}if(!mapped.A||!mapped.B||mapped.A===mapped.B){alert('서로 다른 리모컨 버튼 A와 B를 먼저 지정하세요.');return;}if(!('vibrate'in navigator)){alert('이 기기·브라우저에서 진동 API를 사용할 수 없습니다. Android Chrome에서 열어 주세요.');return;}if(localStorage.getItem('hf-vibration-session-'+id)){alert('이미 같은 ID의 세션이 있습니다. 참가자 ID를 확인하거나 기존 자료를 먼저 내보내세요.');return;}const noise=Number($('#noiseLevel').value);if(noise<.005||noise>.2){alert('잡음 크기를 0.005~0.2 범위로 입력하세요.');return;}const order=SEQ[$('#seq').value];session={schema:'hf-vibration-1',id,created_at:nowIso(),sequence:$('#seq').value,condition_order:order.slice(),mapping:$('#mapping').value==='AB'?{P1:mapped.A,P2:mapped.B}:{P1:mapped.B,P2:mapped.A},noise_level:noise,audio_recording:$('#audioConsent').checked,device:{user_agent:navigator.userAgent,secure_context:isSecureContext},events:[],trials:[],baselines:[],fatigue:[],tlx:[],protocol_deviations:[]};save();try{await activateAudio();await keepAwake();if(session.audio_recording)await beginMic();}catch(e){if(session.audio_recording){const proceed=confirm('음성 녹음을 시작하지 못했습니다: '+e.message+'\n음성 녹음 없이 실험을 진행할까요?');if(!proceed){session=null;renderSetup();return;}session.audio_recording=false;}}addEvent('session_started',{sequence:session.sequence});showBaselineIntro(0);};
    $('#showSaved').onclick=()=>renderSavedSessions();
  }
  document.addEventListener('keydown',e=>{if(captureKey){e.preventDefault();e.stopPropagation();mapped[captureKey]=e.code||e.key;captureKey=null;const a=$('#keyStatus');if(a)a.textContent=`버튼 A: ${mapped.A||'미지정'} · 버튼 B: ${mapped.B||'미지정'}`;const p=$('#preflight');if(p)p.textContent='키 입력을 기록했습니다. 두 버튼을 각각 눌러 서로 다른 입력인지 확인하세요.';return;}if(!running||!activeTrial)return;const key=e.code||e.key;const pattern=session.mapping.P1===key?'P1':session.mapping.P2===key?'P2':null;if(!pattern)return;e.preventDefault();if(activeTrial.response)return;const delay=performance.now()-activeTrial.callPerf;activeTrial.response={key,delay_ms:Math.round(delay),pattern,correct:pattern===activeTrial.pattern,at:nowIso()};clearTimeout(activeTrial.timeoutId);const t=session.trials.find(x=>x.trial_id===activeTrial.trial_id);if(t){t.response_key=key;t.correct=pattern===t.pattern;t.response_delay_ms=Math.round(delay);t.response_at=activeTrial.response.at;t.anticipatory=delay<550; t.call_to_response_ms=Math.round(delay);save();}activeTrial=null;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){addEvent('page_hidden_during_run');stopRun('페이지가 백그라운드로 이동했습니다. 기기 타이밍이 달라질 수 있어 실험을 중지했습니다.');}});
  let rescueTaps=[];
  document.addEventListener('pointerdown',e=>{if(!running)return;const t=performance.now();rescueTaps=rescueTaps.filter(x=>t-x<1300);rescueTaps.push(t);if(rescueTaps.length>=3){rescueTaps=[];stopRun('안전 담당자가 화면을 세 번 눌러 중단했습니다.');}});

  function renderSavedSessions(){const keys=Object.keys(localStorage).filter(k=>k.startsWith('hf-vibration-session-'));if(!keys.length){screen('저장된 세션 없음','<p>이 브라우저에는 저장된 실험 자료가 없습니다.</p><button id="back">돌아가기</button>');$('#back').onclick=renderSetup;return;}const items=keys.map(k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}).filter(Boolean).sort((a,b)=>b.created_at.localeCompare(a.created_at));screen('저장 세션',items.map((s,i)=>`<div class="card"><b>${esc(s.id)}</b><div class="muted">${esc(s.created_at)} · 시행 ${s.trials?.length||0}개 · ${esc(s.status||'진행 중')}</div><div class="row"><button data-export="${i}">CSV 내보내기</button><button data-json="${i}">JSON 내보내기</button></div></div>`).join('')+'<button id="back">설정으로</button>');stage.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{session=items[+b.dataset.export];exportCsv();});stage.querySelectorAll('[data-json]').forEach(b=>b.onclick=()=>{session=items[+b.dataset.json];exportJson();});$('#back').onclick=renderSetup;}
  function showBaselineIntro(i){const names=['걷기 단독 기준선','계산 단독 기준선'];if(i>=2){currentCondition=0;currentBlock=0;showConditionIntro();return;}const label=names[i];screen(`기준선 ${i+1}/2 · ${label}`,`<p>${i===0?'경계선을 따라 안전한 속도로 2분 걷습니다. 옆에서 안전 담당자가 동행합니다.':'박자음에 맞춰 2분간 3씩 빼서 말합니다. 시작 수를 블록 전에 정하고 동일한 박자 규칙을 사용하세요.'}</p><p class="muted">영상·녹음으로 측정할 항목은 기록지에 남기세요. 이 웹앱은 기준선 성과를 자동 채점하지 않습니다.</p><div class="big" id="clock">02:00</div><div class="row"><button class="primary" id="beginBase">기준선 시작</button><button class="danger" id="abort">안전 중단</button></div>`);$('#beginBase').onclick=()=>runBaseline(i);$('#abort').onclick=()=>stopRun('안전 중단');}
  function runBaseline(i){running=true;setRunningVisual(true);let start=performance.now(),end=start+120000;addEvent('baseline_started',{baseline:i===0?'walking':'calculation'});if(i===1){activateAudio().then(()=>{for(let k=0;k<40;k++)toneAt(audio.currentTime+.15+k*3);});}const tick=()=>{if(!running)return;const left=end-performance.now();const el=$('#clock');if(el)el.textContent=fmt(left);if(left<=0){running=false;setRunningVisual(false);addEvent('baseline_finished',{baseline:i===0?'walking':'calculation'});promptBaselineValue(i);return;}timers.push(setTimeout(tick,250));};tick();}
  function promptBaselineValue(i){const name=i===0?'걷기 단독 기준선':'계산 단독 기준선';screen(`${name} 기록`,`${i===0?'<label class="field">보행 속도(m/s)<input id="v" inputmode="decimal"></label><label class="field">경계 이탈 횟수<input id="e" inputmode="numeric"></label>':'<label class="field">계산 정답 수<input id="n" inputmode="numeric"></label><label class="field">계산 오답·무응답 수<input id="w" inputmode="numeric"></label>'}<button class="primary" id="saveBase">기록하고 계속</button>`);$('#saveBase').onclick=()=>{const b={type:i===0?'walking':'calculation',duration_sec:120,recorded_at:nowIso()};if(i===0){b.speed_mps=$('#v').value;b.boundary_exits=$('#e').value;}else{b.correct=$('#n').value;b.errors=$('#w').value;}session.baselines.push(b);save();showBaselineIntro(i+1);};}
  function showConditionIntro(){if(currentCondition>=session.condition_order.length){showFinish();return;}const cond=session.condition_order[currentCondition];currentBlock=0;currentCondition=Number(currentCondition);currentConditionName=cond;screen(`조건 ${currentCondition+1}/4 · ${CNAME[cond]}`,`<p>총 24회이며 8회씩 세 블록으로 진행합니다. 조건 순서는 배정표에 따릅니다.</p><p>${cond[0]==='W'?'실험자가 옆에서 동행합니다.':'서서 안정된 자세를 유지합니다.'} ${cond[1]==='1'?'각 박자마다 계산 답을 말합니다.':'각 박자마다 “삼”이라고 말합니다.'}</p><p class="muted">첫 블록을 시작하기 전 계산 시작 수와 박자에 맞춘 답변 규칙을 확인하세요. 다음 화면부터 시행 중에는 화면이 검게 표시됩니다.</p><button class="primary" id="beginCondition">첫 소블록 시작</button> <button class="danger" id="stopAll">세션 중단</button>`);$('#beginCondition').onclick=()=>{currentConditionName=cond;currentBlock=0;showBlockReady();};$('#stopAll').onclick=()=>stopRun('실험자 중단');}
  let currentConditionName='S0';
  function showBlockReady(){const cond=currentConditionName,block=currentBlock+1; if(block>3){showTLX();return;}const startNum=randomInt(600,999);session.events.push({timestamp:nowIso(),type:'block_ready',condition:cond,block,start_number:cond[1]==='1'?startNum:null});save();screen(`${CNAME[cond]} · 소블록 ${block}/3`,`<p>${cond[1]==='1'?`계산 시작 수 <b>${startNum}</b>를 참가자에게 안내하세요. 첫 답변 시점과 이후 박자별 발화 규칙을 동일하게 적용합니다.`:'계산 조건이 아닙니다. 박자마다 “삼”을 발화합니다.'}</p><p>8회 동안 P1과 P2가 각 4회씩 제시됩니다. 최소 휴식 30초를 포함합니다.</p><button class="primary" id="startBlock">8회 시행 시작</button> <button class="danger" id="stopAll">안전 중단</button>`);$('#startBlock').onclick=()=>runBlock(cond,block);$('#stopAll').onclick=()=>stopRun('실험자 중단');}
  function runBlock(cond,block){if(running)return;running=true;setRunningVisual(true);activeTrial=null;const pats=trialOrder();const plans=[];let beat=0;for(let i=0;i<8;i++){const gap=randomInt(2,3),offset=randomInt(1300,1800);plans.push({index:i+1,pattern:pats[i],beat,offset,gap});beat+=gap;}const last=plans[plans.length-1],totalBeats=last.beat+Math.ceil((last.offset+4500)/3000)+1;const ctx=getAudio();activateAudio().then(()=>{startNoise(session.noise_level);const perfStart=performance.now()+600;const audioStart=ctx.currentTime+.6;for(let k=0;k<totalBeats;k++)toneAt(audioStart+k*3);plans.forEach((p,idx)=>{const target=perfStart+p.beat*3000+p.offset;const id=setTimeout(()=>dispatchTrial(cond,block,p,idx+1,perfStart,target),Math.max(0,target-performance.now()));timers.push(id);});const endDelay=(last.beat*3000+last.offset+4500+1000);timers.push(setTimeout(()=>finishBlock(cond,block),endDelay));});}
  function dispatchTrial(cond,block,p,index,perfStart,targetPerf){if(!running)return;const trialId=`${cond}-B${block}-T${index}-${Date.now()}`;const actual=performance.now();const patternButton=session.mapping[p.pattern];const row={participant_id:session.id,trial_id:trialId,condition:cond,block,trial:index,pattern:p.pattern,pattern_button:patternButton,beat_offset_ms:p.offset,planned_onset_rel_ms:Math.round(targetPerf-perfStart),actual_call_rel_ms:Math.round(actual-perfStart),response_key:null,correct:null,response_delay_ms:null,timeout:false,anticipatory:false,turn_or_overlap:null,device_error:null,interval_beats:p.gap};session.trials.push(row);addEvent('vibration_command',{condition:cond,block,trial:index,pattern:p.pattern,offset_ms:p.offset,planned_rel_ms:row.planned_onset_rel_ms,actual_call_rel_ms:row.actual_call_rel_ms});const ok=vib(patternSeq(p.pattern));row.vibration_api_return=ok;activeTrial={trial_id:trialId,pattern:p.pattern,callPerf:actual,response:null,timeoutId:null};activeTrial.timeoutId=setTimeout(()=>{if(!activeTrial||activeTrial.trial_id!==trialId)return;row.timeout=true;row.correct=null;row.response_delay_ms=null;addEvent('response_timeout',{condition:cond,block,trial:index});activeTrial=null;save();},4500);save();}
  function finishBlock(cond,block){if(!running)return;running=false;activeTrial=null;timers.forEach(clearTimeout);timers=[];vib(0);stopNoise();setRunningVisual(false);session.events.push({timestamp:nowIso(),type:'block_finished',condition:cond,block});save();screen(`${CNAME[cond]} · 소블록 ${block}/3 완료`,`<p>피로도를 기록하고 최소 30초 휴식하세요. 안전 담당자가 참가자 상태를 확인한 뒤 계속합니다.</p><label class="field">피로도 0~10점<input id="fatigue" type="number" min="0" max="10" value="0"></label><div class="big" id="restClock">00:30</div><button class="primary" id="continue" disabled>휴식 후 계속</button><button class="danger" id="stopAll">세션 중단</button>`);const rec={condition:cond,block,fatigue:null,rest_seconds:30};$('#continue').onclick=()=>{session.fatigue.push({...rec,fatigue:Number($('#fatigue').value)});save();currentBlock++;if(currentBlock<3)showBlockReady();else showTLX();};$('#stopAll').onclick=()=>stopRun('실험자 중단');let left=30;const tick=()=>{if(left<=0){$('#restClock').textContent='휴식 완료';$('#continue').disabled=false;return;}$('#restClock').textContent=fmt(left*1000);left--;timers.push(setTimeout(tick,1000));};tick();}
  function showTLX(){const cond=currentConditionName;screen(`${CNAME[cond]} · 작업부하 기록`,`<p>각 항목을 0~100점으로 기록합니다. 수행도는 잘함=0, 못함=100으로 입력합니다.</p><div class="ratings">${['정신적 요구','신체적 요구','시간적 요구','수행도','노력','좌절감'].map((n,i)=>`<label for="tlx${i}">${n}</label><input id="tlx${i}" type="number" min="0" max="100" value="0">`).join('')}</div><button class="primary" id="saveTlx">저장하고 조건 간 휴식</button>`);$('#saveTlx').onclick=()=>{const values=[0,1,2,3,4,5].map(i=>Number($('#tlx'+i).value));if(values.some(v=>!Number.isFinite(v)||v<0||v>100)){alert('각 점수는 0~100이어야 합니다.');return;}session.tlx.push({condition:cond,values,raw_mean:values.reduce((a,b)=>a+b,0)/6,recorded_at:nowIso()});save();currentCondition++;if(currentCondition>=4){showFinish();return;}conditionRest();};}
  function conditionRest(){screen('조건 간 휴식',`<p>최소 1분 휴식합니다. 참가자가 더 쉬어야 하면 휴식을 연장하세요.</p><div class="big" id="restClock">01:00</div><button id="continue" class="primary" disabled>다음 조건으로</button><button id="extend">30초 더 쉬기</button>`);let left=60;const tick=()=>{if(left<=0){$('#restClock').textContent='휴식 완료';$('#continue').disabled=false;return;}$('#restClock').textContent=fmt(left*1000);left--;timers.push(setTimeout(tick,1000));};tick();$('#extend').onclick=()=>{left+=30;$('#continue').disabled=true;};$('#continue').onclick=showConditionIntro;}
  function stopRun(reason){running=false;activeTrial=null;timers.forEach(clearTimeout);timers=[];vib(0);stopNoise();setRunningVisual(false);if(session){session.status='stopped';session.stop_reason=reason;session.stopped_at=nowIso();addEvent('session_stopped',{reason});}stopMic();screen('실험 중단',`<p class="dangerText">${esc(reason)}</p><p>안전 상태를 먼저 확인하고, 진행 중이던 시행을 기록에서 확인하세요. 중단한 시행은 자동으로 다시 제시하지 않습니다.</p><div class="row"><button id="json">현재 자료 JSON 저장</button><button id="csv">현재 시행 CSV 저장</button><button id="home">설정 화면</button></div>`);if(session.audio_recording){const v=document.createElement('button');v.id='voiceDownload';v.disabled=true;v.textContent='\uC74C\uC131 \uD30C\uC77C \uB2E4\uC6B4\uB85C\uB4DC';$('#home').before(v);v.onclick=()=>voiceBlob&&download(session.id+'_voice.webm',voiceBlob);}$('#json').onclick=exportJson;$('#csv').onclick=exportCsv;$('#home').onclick=renderSetup;}
  function showFinish(){session.status='completed';session.completed_at=nowIso();save();setRunningVisual(false);screen('세션 완료',`<p>시행 ${session.trials.length}개 · 조건 순서 ${session.condition_order.join(' → ')}</p><p class="muted">음성 녹음에 동의했고 녹음이 시작된 경우, 다운로드를 확인한 뒤 파일명을 참가자 ID와 대조하세요. 원본 자료를 안전한 연구 저장 위치로 옮긴 후 브라우저의 임시 세션을 정리하세요.</p><div class="row"><button class="primary" id="csv">시행 CSV 다운로드</button><button id="json">전체 세션 JSON 다운로드</button><button id="home">새 참가자 설정</button></div>`);stopMic();if(session.audio_recording){const v=document.createElement('button');v.id='voiceDownload';v.disabled=true;v.textContent='\uC74C\uC131 \uD30C\uC77C \uB2E4\uC6B4\uB85C\uB4DC';$('#home').before(v);v.onclick=()=>voiceBlob&&download(session.id+'_voice.webm',voiceBlob);}$('#csv').onclick=exportCsv;$('#json').onclick=exportJson;$('#home').onclick=()=>{session=null;renderSetup();};}
  function showNextStage(){showBaselineIntro(0);}
  window.addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue='실험이 진행 중입니다.';}});
  if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  renderSetup();
})();
</script>
</body>
